<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Shield Primary Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Glowing Checkmark / Node Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle tech grid / ring accent -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="215" fill="none" stroke="#0f172a" stroke-width="1.5"/>

  <!-- Outer Ambient Shield Glow -->
  <path d="M256 90 L380 144 C380 270 256 380 256 410 C256 380 132 270 132 144 Z" 
        fill="none" 
        stroke="url(#shieldGrad)" 
        stroke-width="12" 
        opacity="0.35" 
        filter="url(#glow)"/>

  <!-- Main Shield Contour -->
  <path d="M256 100 L370 150 C370 265 256 368 256 396 C256 368 142 265 142 150 Z" 
        fill="#0f172a" 
        stroke="url(#shieldGrad)" 
        stroke-width="8" 
        stroke-linejoin="round"/>

  <!-- Document / Diploma Silhouette inside Shield -->
  <g transform="translate(186, 155)">
    <!-- Document Body -->
    <rect x="0" y="0" width="140" height="180" rx="14" fill="#1e293b" stroke="#334155" stroke-width="4"/>
    
    <!-- Document Fold Corner -->
    <path d="M104 0 L140 36 L104 36 Z" fill="#3b82f6"/>
    
    <!-- Document Text Hash Lines -->
    <rect x="24" y="52" width="60" height="8" rx="4" fill="#60a5fa" opacity="0.8"/>
    <rect x="24" y="74" width="92" height="6" rx="3" fill="#64748b" opacity="0.6"/>
    <rect x="24" y="92" width="80" height="6" rx="3" fill="#64748b" opacity="0.6"/>
    <rect x="24" y="110" width="88" height="6" rx="3" fill="#64748b" opacity="0.6"/>
  </g>

  <!-- Cryptographic Blockchain Stamp / Badge -->
  <circle cx="256" cy="305" r="48" fill="#030712" stroke="url(#accentGrad)" stroke-width="6" filter="url(#glow)"/>

  <!-- Glowing Verification Checkmark -->
  <path d="M236 305 L250 319 L280 289" 
        fill="none" 
        stroke="url(#accentGrad)" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Blockchain Node Connector Dots -->
  <circle cx="142" cy="150" r="7" fill="#38bdf8"/>
  <circle cx="370" cy="150" r="7" fill="#38bdf8"/>
  <circle cx="256" cy="100" r="7" fill="#60a5fa"/>
  <circle cx="256" cy="396" r="8" fill="#34d399"/>
</svg>

